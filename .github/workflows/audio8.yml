name: Audio8 Realistic Windows qualification and packages
on:
  workflow_dispatch:
  push:
    branches: [codex/audio8-realistic]
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
      - name: Verify every established inference worker and model is preserved
        run: python scripts/verify-audio8.py
      - name: Authenticate successful identical Chrome and native checks
        run: python scripts/verify-audio8-proof.py
      - name: Prepare pinned build and media tools
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/prepare-ffmpeg.ps1
          ./scripts/prepare-prosody.ps1
          rustup update stable --no-self-update
      - name: Complete frontend, Chrome and MCP schema checks
        run: |
          pnpm mcp:check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm lint
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm format:check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not $env:STUDIO_AUDIO8_CHECKS_REUSED) {
            pnpm test:e2e
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Native regression tests, lints and formatting
        run: |
          git restore -- docs/screenshots
          if (-not $env:STUDIO_AUDIO8_CHECKS_REUSED) {
            cargo test --locked --manifest-path src-tauri/Cargo.toml
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Worker regression tests
        run: |
          python -m pip install numpy==2.2.6 scipy==1.15.3 soundfile==0.13.1 opencv-python-headless==4.11.0.86
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s workers -p "test_*.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build signed Windows updater installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: pnpm desktop:build
      - name: Prepare verified reference and real Japanese ASR
        run: ./scripts/test-reference-transcription.ps1
      - name: Package Windows installer and portable version
        run: ./scripts/package-windows.ps1
      - name: Real Audio8 installation and French single and hot batch cloning via packaged MCP
        run: ./scripts/test-audio8.ps1
      - name: Verify the actual generated words with automatic language ASR
        run: python scripts/test-audio8-asr.py
      - name: Full-weight overlapping voice separation regression
        run: python scripts/test-speaker-separation.py
      - name: Complete packaged desktop regression through official MCP SDK
        run: ./scripts/test-mcp.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audio8-windows-packages-and-validation
          path: |
            artifacts/*
            test-results/
            .cache/audio8-native/**/*.log
          include-hidden-files: true
          if-no-files-found: error
