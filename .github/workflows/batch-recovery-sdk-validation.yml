name: Batch recovery packaged SDK continuation
on:
  workflow_dispatch:
  push:
    branches: [codex/take-dates-batch-sdk-validation]
permissions:
  contents: read
  actions: read
jobs:
  packaged:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
      - name: Verify unchanged compiled application
        shell: python
        run: |
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          baseline='f23c2818604c95ce1fae8d82de2af001090f93d5'
          changed=set(git('diff','--name-only',baseline,'HEAD').splitlines())
          assert changed=={'tests/e2e/reference-range-batch.pw.ts','tests/e2e/phase5.pw.ts','.github/workflows/batch-recovery-ui-validation.yml','.github/workflows/batch-recovery-ui-final.yml','scripts/test-batch-recovery-mcp.mjs','.github/workflows/batch-recovery-sdk-validation.yml'},changed
          for p in ['src','src-tauri','workers','public','package.json','pnpm-lock.yaml','vite.config.ts','playwright.config.ts','tests/e2e/nativeMock.ts','scripts/package-windows.ps1','scripts/test-mcp.ps1']:
              assert git('rev-parse','HEAD:'+p)==git('rev-parse',baseline+':'+p),p
          print('Compiled application, native code, workers, packaging and SDK launcher identical.')
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          artifact-ids: '13339304460'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 41857606769
          path: .cache/reused-batch-package
      - name: Verify exact original package hashes
        run: |
          $source=Get-ChildItem -LiteralPath .cache/reused-batch-package -Recurse -Filter SHA256SUMS.txt
          if (@($source).Count -ne 1) { throw 'Expected original package checksums' }
          foreach($line in Get-Content -LiteralPath $source.FullName){
            if($line -notmatch '^([a-fA-F0-9]{64})  ([^/\\]+)$'){throw 'Invalid package checksum line'}
            $expected=$Matches[1];$name=$Matches[2]
            $file=Join-Path $source.DirectoryName $name
            if((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $expected){throw "Package hash mismatch: $name"}
          }
      - name: Prepare pinned SDK dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm exec prettier --check scripts/test-batch-recovery-mcp.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Actual packaged batch reports and recovery through official MCP SDK
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $portable=Get-ChildItem -LiteralPath .cache/reused-batch-package -Recurse -Filter AI-Dubbing-Studio-Windows-Portable.zip
          if(@($portable).Count -ne 1){throw 'Expected original portable package'}
          ./scripts/test-mcp.ps1 -PortablePath $portable.FullName -ClientScript test-batch-recovery-mcp.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: batch-recovery-packaged-sdk-proof
          path: artifacts/mcp-native-validation.json
          if-no-files-found: error
