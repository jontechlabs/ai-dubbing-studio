name: Complete neural checks with exact rebuilt package
on:
  workflow_dispatch:
  push:
    branches: [codex/voice-library]
    paths: [.github/workflows/complete-neural-rebuild.yml]
permissions:
  contents: read
  actions: read
jobs:
  complete-voice-conversion:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
      - name: Authenticate exact package, base suites and completed Vox and Chatterbox proofs
        run: python scripts/recover-rebuilt-package.py
      - name: Actual seeded conversion from fixed clean French source
        run: ./scripts/test-multilingual.ps1 -VoiceConversionOnly
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-x64-development-build
          path: artifacts/*
          if-no-files-found: error
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: failure-diagnostics
          path: |
            artifacts/*
            .cache/multilingual-validation/*.log
            .cache/multilingual-validation/*.json
            .cache/multilingual-validation/*.wav
          include-hidden-files: true
          if-no-files-found: ignore
