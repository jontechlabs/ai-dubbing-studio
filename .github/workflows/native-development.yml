name: Native development checks
on:
  workflow_dispatch:
  push:
    branches: [codex/voice-library]
    paths: [.github/workflows/native-development.yml]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
      - name: Prepare compilation and media fixtures
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/prepare-ffmpeg.ps1
          ./scripts/prepare-prosody.ps1
      - name: Native tests, lints and formatting
        run: |
          pnpm exec playwright test tests/e2e/speaker-dubbing.pw.ts --trace off
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: overlapping-voices-preview
          path: docs/screenshots/overlapping-voices.png
          if-no-files-found: error
      - name: Native compilation and complete regression checks
        run: |
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
