name: Real native voice diagnostic on existing signed package
on:
  push:
    branches: [codex/native-voices-probe]
permissions:
  contents: read
  actions: read
jobs:
  neural:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Prepare SDK and exact previously compiled package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          if($LASTEXITCODE){exit $LASTEXITCODE}
          gh run download 43713690440 --repo jontechlabs/ai-dubbing-studio --name native-voices-windows-packages-and-validation --dir .probe
          if($LASTEXITCODE){exit $LASTEXITCODE}
      - name: Test neural paths while final reference-import fix compiles separately
        run: |
          # The old binary's one known import-format bug is bypassed in this
          # isolated fixture only. Full release CI tests the real source fix.
          $file=Join-Path $PWD 'scripts/test-native-voices-mcp.mjs'
          $text=[IO.File]::ReadAllText($file)
          $anchor="  const options = { ...base, referenceMode: 'file', referenceId: ref.id };"
          $first="  await call('studio_import_dubbing_reference', {"
          if(-not $text.Contains($first)){throw 'Probe fixture anchor missing'}
          $prefix="  await call('studio_project_patch', { patches: [{ op: 'replace', path: '/formatVersion', value: 31 }] });`n"
          $at=$text.IndexOf($first)
          [IO.File]::WriteAllText($file,$text.Insert($at,$prefix))
          $probe=[IO.File]::ReadAllText($file)
          $old="  const r = await client.callTool({ name, arguments: input });"
          $new=@'
            let r;
            try { r = await client.callTool({ name, arguments: input }); }
            catch (e) {
              if (name !== 'studio_list_jobs' || !String(e).includes('Connection closed')) throw e;
              console.log('DIAGNOSTIC: reconnecting read-only job polling after relay exit');
              await client.connect(new StdioClientTransport({ command: args.exe, args: ['--mcp', '--endpoint', args.endpoint], stderr: 'inherit' }));
              r = await client.callTool({ name, arguments: input });
            }
          '@
          if(-not $probe.Contains($old)){throw 'Read-only reconnect anchor missing'}
          [IO.File]::WriteAllText($file,$probe.Replace($old,$new))
          $baseline=Join-Path $PWD 'scripts/test-volume-leveling-mcp.mjs'
          $fixture=[IO.File]::ReadAllText($baseline)
          $gate="    for (const mode of ['low', 'high']) {"
          $wait="    await new Promise((r) => setTimeout(r, 1000));`n    await until(async () => !(await call('studio_list_jobs')).some((j) => ['queued', 'running'].includes(j.status)));`n"
          if(-not $fixture.Contains($gate)){throw 'Baseline fixture anchor missing'}
          [IO.File]::WriteAllText($baseline,$fixture.Replace($gate,$wait+$gate))
          $portable=@(Get-ChildItem -LiteralPath .probe -Recurse -Filter AI-Dubbing-Studio-Windows-Portable.zip)
          if($portable.Count -ne 1){throw 'Expected one authenticated Actions package'}
          $test=Join-Path $PWD 'scripts/test-volume-leveling.ps1'
          $testSource=[IO.File]::ReadAllText($test)
          $audit=@'
            } catch {
                Write-Host "DIAGNOSTIC desktop exited: $($desktop.HasExited)"
                if($desktop.HasExited){Write-Host "DIAGNOSTIC desktop exit code: $($desktop.ExitCode)"}
                Get-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize,FreePhysicalMemory,TotalVirtualMemorySize,FreeVirtualMemory | Format-List
                Get-Process | Where-Object { $_.ProcessName -match '^(audiocpp|AI Dubbing Studio|ai-dubbing-studio|msedgewebview2)' } | Select-Object Id,ProcessName,WorkingSet64,PrivateMemorySize64 | Format-Table
                Get-Content -LiteralPath (Join-Path $dataRoot 'jobs.json') -Tail 1 -ErrorAction SilentlyContinue
          '@
          [IO.File]::WriteAllText($test,$testSource.Replace('    } catch {',$audit))
          ./scripts/test-volume-leveling.ps1 -PortablePath $portable[0].FullName -NativeVoices
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-voices-probe-diagnostic
          path: |
            artifacts/*validation.json
            .cache/volume-leveling-native/**/session/jobs.json
            .cache/volume-leveling-native/**/*.stderr.log
            .cache/volume-leveling-native/**/*.stdout.log
          if-no-files-found: ignore
