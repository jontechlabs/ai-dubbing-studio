name: Source transcription and take volume packages
on:
  workflow_dispatch:
  push:
    branches: [codex/source-transcription-volume]
    paths: [.github/workflows/source-volume.yml]
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
      - name: Verify unchanged inference models and worker inputs
        run: python scripts/verify-source-volume.py
      - name: Prepare pinned tools and dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/prepare-ffmpeg.ps1
          ./scripts/prepare-prosody.ps1
          rustup update stable --no-self-update
      - name: Frontend unit, browser, formatting, lint and MCP schemas
        run: |
          pnpm mcp:check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm lint
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm format:check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm test:e2e
      - name: Native tests with real FFmpeg, lints and formatting
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Worker regression checks
        run: |
          python -m pip install numpy==2.2.6 scipy==1.15.3 soundfile==0.13.1 opencv-python-headless==4.11.0.86
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s workers -p "test_*.py"
      - name: Build Windows installer with updater signature
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: pnpm desktop:build
      - name: Real Japanese reference transcription
        run: ./scripts/test-reference-transcription.ps1
      - name: Package installer and portable build
        run: ./scripts/package-windows.ps1
      - name: Packaged desktop, source ASR and gain through official MCP SDK
        run: ./scripts/test-mcp.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-x64-development-build
          path: artifacts/*
          if-no-files-found: error
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: failure-diagnostics
          path: |
            artifacts/*
            test-results/
            .cache/mcp-native/**/*.log
            .cache/reference-transcription/**/*.log
          include-hidden-files: true
          if-no-files-found: ignore
