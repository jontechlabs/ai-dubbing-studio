name: Windows checks and packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ui_maintenance:
        description: UI-only release with exact unchanged native, worker, DSP and project code
        type: boolean
        default: false
      mcp_maintenance:
        description: MCP-only patch with unchanged workers; verify source identity and skip repeated full-weight TTS/VC
        type: boolean
        default: false
      complete_neural:
        description: Complete neural validation of an identical previously built application
        type: boolean
        default: false
      validation_base_run:
        description: Failed Windows run whose only failure was the final neural step
        type: string
        default: ''

      multilingual_validation_run:
        description: Optional run with successful multilingual proof before a VC fixture failure
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  windows:
    if: ${{ !inputs.complete_neural }}
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify MCP-only changes and identical inference workers
        if: ${{ inputs.mcp_maintenance }}
        run: python scripts/verify-mcp-maintenance.py
      - name: Verify UI-only changes and identical native and audio engines
        if: ${{ inputs.ui_maintenance }}
        run: python scripts/verify-ui-maintenance.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install pnpm and dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Prepare pinned media and prosody tools
        run: |
          ./scripts/prepare-ffmpeg.ps1
          ./scripts/prepare-prosody.ps1
      - name: Frontend checks
        run: |
          pnpm mcp:check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm lint
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm format:check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm test:e2e
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - name: Rust checks
        run: |
          rustup update stable --no-self-update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Worker device and process checks
        run: |
          python -m pip install numpy==2.2.6 scipy==1.15.3 soundfile==0.13.1 opencv-python-headless==4.11.0.86
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s workers -p "test_*.py"
      - name: Real local Japanese to French translation
        # Pinned 4B Q4_K_M model, CPU inference; no NVIDIA benchmark claim.
        run: ./scripts/test-translation-model.ps1
      - name: Actual human and anime face detection on CPU
        run: |
          python -m pip install --no-deps opencv-python-headless==4.11.0.86
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python scripts/test-face-detection.py | Tee-Object artifacts/face-detection-validation.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Drama 3 actual FP8 offload and tiny autoregressive diagnostic
        # CPU diagnostic only: no large model weights and no GPU qualification claim.
        run: |
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install transformers==4.51.3 tokenizers==0.21.4 safetensors==0.8.0 einops==0.8.2 psutil==7.2.2 comfy-kitchen==0.2.37 comfy-aimdo==0.5.6 blake3==1.0.8
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python scripts/test-drama-core.py | Tee-Object artifacts/drama-core-validation.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: CosyVoice causal vocoder finalization diagnostic
        run: |
          python scripts/test-cosyvoice-tail.py | Tee-Object artifacts/cosyvoice-tail-validation.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: LatentSync actual neural core and official checkpoint architecture
        # Small actual CPU models and pinned checkpoint headers; no GPU benchmark.
        run: |
          python -m pip install diffusers==0.32.2 einops==0.8.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test-latentsync-core.py | Tee-Object artifacts/latentsync-core-validation.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build unsigned Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: pnpm desktop:build
      - name: Verify real Japanese reference transcription
        # This calls only the headless worker, without opening the desktop UI.
        run: ./scripts/test-reference-transcription.ps1
      - name: Package portable build and checksums
        run: ./scripts/package-windows.ps1
      - name: Packaged desktop controlled through the official MCP SDK
        run: ./scripts/test-mcp.ps1
      - name: Actual VoxCPM2 and Chatterbox V3 French generation from Japanese reference
        if: ${{ !inputs.mcp_maintenance && !inputs.ui_maintenance }}
        # Full official weights, two requests per hot worker, auto-language ASR.
        # CPU Torch 2.8 here; no RTX memory/speed qualification claim.
        run: ./scripts/test-multilingual.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-development-build
          path: artifacts/*
          if-no-files-found: error
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failure-diagnostics
          path: |
            artifacts/*
            test-results/
            .cache/reference-transcription/**/*.log
            .cache/reference-transcription/**/*.json
            .cache/mcp-native/**/*.stdout.log
            .cache/mcp-native/**/*.stderr.log
            .cache/multilingual-validation/*.log
            .cache/multilingual-validation/*.json
          include-hidden-files: true
          if-no-files-found: ignore

  windows-neural-completion:
    if: ${{ inputs.complete_neural }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_RUN_ID: ${{ inputs.validation_base_run }}
      MULTILINGUAL_RUN_ID: ${{ inputs.multilingual_validation_run }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - name: Authenticate previous checks, unchanged application source and exact build assets
        run: python scripts/complete-neural-validation.py
      - name: Verify real Japanese reference transcription
        run: ./scripts/test-reference-transcription.ps1
      - name: Actual VoxCPM2 and Chatterbox V3 French generation from Japanese reference
        if: ${{ inputs.multilingual_validation_run == '' }}
        run: ./scripts/test-multilingual.ps1
      - name: Fresh offline voice conversion from authenticated Standard French audio
        if: ${{ inputs.multilingual_validation_run != '' }}
        run: ./scripts/test-multilingual.ps1 -VoiceConversionOnly
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-development-build
          path: artifacts/*
          if-no-files-found: error
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failure-diagnostics
          path: |
            artifacts/*
            .cache/reference-transcription/**/*.log
            .cache/reference-transcription/**/*.json
            .cache/multilingual-validation/*.log
            .cache/multilingual-validation/*.json
            .cache/multilingual-validation/*.wav
          include-hidden-files: true
          if-no-files-found: ignore
