name: ZONOS3 and MOSS native regression checks
on:
  workflow_dispatch:
  push:
    branches: [codex/zonos3-local-engines]
    paths: [src-tauri/**, .github/workflows/zonos3-native.yml]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verified native runtime starts on a Windows machine without a GPU
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $spec=(Get-Content workers/voice-engines.json -Raw | ConvertFrom-Json).engineV095
          $folder=Join-Path $env:RUNNER_TEMP 'studio-native-runtime-check'
          New-Item -ItemType Directory -Force $folder | Out-Null
          $archive=Join-Path $folder 'runtime.zip'
          Invoke-WebRequest -Uri $spec.url -OutFile $archive
          if((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $spec.sha256){throw 'Native runtime checksum mismatch'}
          $runtime=Join-Path $folder 'runtime'
          Expand-Archive -LiteralPath $archive -DestinationPath $runtime
          & (Join-Path $runtime 'audiocpp_cli.exe') --list-devices
          if($LASTEXITCODE){throw "Native runtime device inventory failed: $LASTEXITCODE"}
  native:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
      - name: Prepare native fixtures
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/prepare-ffmpeg.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/prepare-prosody.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup update stable --no-self-update
      - name: Native voice contracts and complete regressions
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
